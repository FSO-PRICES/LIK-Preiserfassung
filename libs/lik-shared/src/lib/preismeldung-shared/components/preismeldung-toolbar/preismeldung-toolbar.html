<ion-button *ngIf="!isAdminApp" class="pef-tab-button icon-only" (click)="homeButtonClicked$.emit()">
    <pef-icon name="home"></pef-icon>
</ion-button>
<div class="preismeldung-buttons">
    <ion-button
        class="pef-tab-button icon-only"
        [disabled]="!preismeldung || (selectedTab$ | async) === 'INFO_WARENKORB'"
        [class.selected]="(selectedTab$ | async) === 'INFO_WARENKORB'"
        (click)="selectTab$.emit('INFO_WARENKORB')">
        <pef-icon name="zusatzinfo"></pef-icon>
    </ion-button>
    <ion-button
        class="pef-tab-button icon-only"
        [disabled]="!preismeldung || (selectedTab$ | async) === 'PREISMELDUNG_INFO'"
        [class.selected]="(selectedTab$ | async) === 'PREISMELDUNG_INFO'"
        (click)="selectTab$.emit('PREISMELDUNG_INFO')">
        <pef-icon name="price_tag_info"></pef-icon>
    </ion-button>
    <ion-button
        class="pef-tab-button icon-only"
        [disabled]="!preismeldung || (selectedTab$ | async) === 'PRODUCT_ATTRIBUTES' || !(hasAttributes$ | async)!"
        [class.selected]="(selectedTab$ | async) === 'PRODUCT_ATTRIBUTES'"
        (click)="selectTab$.emit('PRODUCT_ATTRIBUTES')">
        <div class="tab-icon-with-warning">
            <pef-icon name="price_tag"></pef-icon>
            <pef-icon
                class="warning-icon"
                [name]="'warning'"
                *ngIf="!!preismeldung && (preismeldung$ | async).hasAttributeWarning"></pef-icon>
        </div>
    </ion-button>
    <ion-button
        class="pef-tab-button icon-only"
        [disabled]="!preismeldung || (selectedTab$ | async) === 'MESSAGES'"
        [class.selected]="(selectedTab$ | async) === 'MESSAGES'"
        (click)="selectTab$.emit('MESSAGES')">
        <div class="tab-icon-with-warning">
            <pef-icon name="produkteigenschaften"></pef-icon>
            <pef-icon
                class="info-icon"
                [name]="'info'"
                *ngIf="!!preismeldung && (preismeldung$ | async).hasMessageNotiz"></pef-icon>
            <pef-icon
                class="warning-icon"
                [name]="'warning'"
                *ngIf="!!preismeldung && (preismeldung$ | async).hasMessageToCheck"></pef-icon>
        </div>
    </ion-button>
    <ion-button
        class="pef-tab-button icon-only"
        [disabled]="!preismeldung || (selectedTab$ | async) === 'PREISMELDUNG'"
        [class.selected]="(selectedTab$ | async) === 'PREISMELDUNG'"
        (click)="selectTab$.emit('PREISMELDUNG')">
        <div class="tab-icon-with-warning">
            <pef-icon name="notification"></pef-icon>
            <pef-icon
                class="warning-icon"
                [name]="'warning'"
                *ngIf="!!preismeldung && (preismeldung$ | async).hasPriceWarning"></pef-icon>
        </div>
    </ion-button>

    <ion-button
        *ngIf="!!preismeldung"
        class="pef-toolbar-button icon-only quick-equal-button"
        (click)="quickEqualButtonClicked$.emit()"
        [disabled]="(preismeldung$ | async)?.isReadonly"
        [class.hidden]="(selectedTab$ | async) !== 'PREISMELDUNG' || (requestPreismeldungQuickEqualDisabled$ | async)"
        [class.disable-hover]="!isDesktop">
        <div class="pef-inner">
            <pef-icon name="equal"></pef-icon>
        </div>
    </ion-button>
    <ion-button
        *ngIf="!!preismeldung && !isAdminApp && !(disableSaveButton$ | async)!"
        class="pef-toolbar-button icon-only"
        (click)="saveButtonClicked$.emit()"
        [disabled]="disableSaveButton$ | async"
        [class.hidden]="(selectedTab$ | async) !== 'PREISMELDUNG'"
        [class.disable-hover]="!isDesktop">
        <div class="pef-inner">
            <pef-icon name="save"></pef-icon>
        </div>
    </ion-button>
    <ion-button
        *ngIf="!!preismeldung && !isAdminApp && (disableSaveButton$ | async)"
        class="pef-toolbar-button icon-only"
        (click)="selectNextPreismeldungButtonClicked$.emit()"
        [disabled]="(disableSelectNextPreismeldungButton$ | async)"
        [class.hidden]="(selectedTab$ | async) !== 'PREISMELDUNG'"
        [class.disable-hover]="!isDesktop">
        <div class="pef-inner">
            <pef-icon name="arrow_right"></pef-icon>
        </div>
    </ion-button>
</div>
